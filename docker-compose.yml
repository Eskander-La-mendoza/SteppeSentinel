name: pasturevision
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pasturevision}
      POSTGRES_USER: ${POSTGRES_USER:-pasturevision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pasturevision}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pasturevision:pasturevision@postgres:5432/pasturevision}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: ${API_PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@steppe.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-SteppeAdmin2026!}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID:-}
      COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET:-}
      MAX_POLYGON_AREA_HA: ${MAX_POLYGON_AREA_HA:-250000}
      MAX_GEOMETRY_POINTS: ${MAX_GEOMETRY_POINTS:-5000}
      MAX_RASTER_BYTES: ${MAX_RASTER_BYTES:-52428800}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${API_PORT:-4000}/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pasturevision:pasturevision@postgres:5432/pasturevision}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID:-}
      COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET:-}
      COPERNICUS_TIMEOUT_MS: ${COPERNICUS_TIMEOUT_MS:-30000}
      MAX_RASTER_BYTES: ${MAX_RASTER_BYTES:-52428800}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      backend: { condition: service_healthy }
    mem_limit: 2g
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
